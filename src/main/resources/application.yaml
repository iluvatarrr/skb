spring:
  application:
    name: ${NAME:skb-spring}
  datasource:
    driver-class-name: ${POSTGRES_DRIVER:org.postgresql.Driver}
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/to_do}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true

server:
  port: 8081